# OpenTelemetry Collector configuration for local development.
#
# Services export OTLP to http://localhost:4318 (see .env). The collector
# batches the telemetry and forwards traces to Jaeger for visualization.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
