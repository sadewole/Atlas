# OpenTelemetry Collector configuration for local development.
#
# Services export OTLP to http://localhost:4318 (see .env). The collector
# batches the telemetry and forwards:
#   - traces  → Jaeger (visualization at http://localhost:16686)
#   - metrics → Prometheus (scraped at http://localhost:9090)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
