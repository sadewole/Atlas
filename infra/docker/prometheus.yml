# Prometheus configuration for local development.
#
# Scrapes the OpenTelemetry collector's Prometheus exporter endpoint
# (exposed on port 8889 by the collector's prometheus exporter). Metrics flow:
#
#   Atlas services ──OTLP──▶ otel-collector ──scrape──▶ Prometheus (:9090)
#
# Prometheus UI: http://localhost:9090

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
