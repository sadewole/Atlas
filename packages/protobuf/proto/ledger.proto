syntax = "proto3";

package ledger.v1;

// Ledger Service — internal gRPC API.
//
// Used by the Wallet Service (CreateAccount) and Transfer Service
// (PostJournal, GetBalance). REST remains the external API; gRPC is the
// internal transport. All money is in minor units (kobo/cents).
service LedgerService {
  // Provision a ledger account (e.g. a wallet's liability account).
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // Post a balanced journal (debits must equal credits).
  rpc PostJournal(PostJournalRequest) returns (PostJournalResponse);
  // Read an account's current balance projection.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

message CreateAccountRequest {
  string account_code = 1;
  string name = 2;
  string type = 3; // asset | liability | equity | revenue | expense
  string currency = 4;
}

message CreateAccountResponse {
  string id = 1;
  string account_code = 2;
  string name = 3;
  string type = 4;
  string currency = 5;
  string status = 6;
}

message Posting {
  string account_id = 1;
  string direction = 2; // debit | credit
  int64 amount = 3; // minor units
}

message PostJournalRequest {
  string reference = 1;
  string description = 2;
  string currency = 3;
  repeated Posting postings = 4;
}

message PostJournalResponse {
  string journal_id = 1;
  string reference = 2;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string account_id = 1;
  string account_code = 2;
  string currency = 3;
  int64 balance = 4; // minor units
}
